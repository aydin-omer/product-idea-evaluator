<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ürün Fikri Değerlendirme Aracı</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #6366f1;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .container {
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 6px;
  }
  .subtitle {
    color: var(--muted);
    margin-bottom: 32px;
    font-size: 15px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .question {
    margin-bottom: 24px;
  }
  .question:last-child {
    margin-bottom: 0;
  }
  .question label.title {
    display: block;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .question .desc {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 12px;
  }
  .options {
    display: flex;
    gap: 8px;
  }
  .option {
    flex: 1;
    text-align: center;
    padding: 10px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
    user-select: none;
  }
  .option:hover {
    border-color: var(--accent);
  }
  .option.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    font-weight: 600;
  }
  button#evaluate {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button#evaluate:hover {
    opacity: 0.9;
  }
  #result {
    display: none;
  }
  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    border: 6px solid var(--border);
    transition: border-color 0.3s;
  }
  .score-number {
    font-size: 36px;
    font-weight: 700;
  }
  .score-label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .verdict {
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .verdict-desc {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 20px;
  }
  .breakdown {
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .breakdown-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 14px;
  }
  .bar-bg {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    margin: 0 12px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .reset-link {
    display: block;
    text-align: center;
    margin-top: 16px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="container">
  <h1>💡 Ürün Fikri Değerlendirme Aracı</h1>
  <div class="subtitle">4 klasik ürün yönetimi kriterine göre fikrini hızlıca değerlendir.</div>

  <div class="card" id="form-card">
    <div class="question" data-key="market">
      <label class="title">Pazar Büyüklüğü</label>
      <div class="desc">Bu fikrin hedeflediği pazar ne kadar büyük?</div>
      <div class="options">
        <div class="option" data-value="1">Düşük</div>
        <div class="option" data-value="2">Orta</div>
        <div class="option" data-value="3">Yüksek</div>
      </div>
    </div>

    <div class="question" data-key="competition">
      <label class="title">Rekabet Yoğunluğu</label>
      <div class="desc">Bu alanda ne kadar yoğun rekabet var?</div>
      <div class="options">
        <div class="option" data-value="3">Düşük</div>
        <div class="option" data-value="2">Orta</div>
        <div class="option" data-value="1">Yüksek</div>
      </div>
    </div>

    <div class="question" data-key="feasibility">
      <label class="title">Uygulanabilirlik</label>
      <div class="desc">Mevcut kaynaklarla ne kadar kolay hayata geçirilebilir?</div>
      <div class="options">
